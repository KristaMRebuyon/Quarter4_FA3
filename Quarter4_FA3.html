<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quarter 4 FA3</title>
    <link rel="stylesheet" href="Quarter4_FA3styles.css">
</head>
<body>
    <h1>Quarter 4 FA3</h1>

    <section id="shapeGenerator">
        <h2>Shape Generator</h2>
        <button onclick="getNumber()">Start</button>
        <p id="output"></p>
    </section>

    <section id="contactsListSection">
        <h2>Contacts List</h2>
        <input type="text" id="nameInput" placeholder="Enter name">
        <button onclick="addContact()">Add</button>
        <button onclick="removeContact()">Remove</button>
        <ul id="contactsList"></ul>
    </section>

    <script src="Quarter4_FA3script.js"></script>
</body>
</html>
